name: apneicare_ble
description: >-
  Flutter/FlutterFlow healthcare BLE package for overnight SpO2 sleep tracking
  (Apneicare W628 / MD300W628) over flutter_blue_plus.
version: 0.1.2
homepage: https://github.com/VirtuousTechlogicMobile/apneicare_ble
repository: https://github.com/VirtuousTechlogicMobile/apneicare_ble
issue_tracker: https://github.com/VirtuousTechlogicMobile/apneicare_ble/issues

topics:
  - health
  - fitness
  - sleep-tracking
  - spo2
  - flutterflow

environment:
